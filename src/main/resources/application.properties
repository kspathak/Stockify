spring.application.name=Stockify

# ── Finnhub ──────────────────────────────────────────────────────────
# Get a free key at https://finnhub.io/register
stockify.finnhub.api-key=YOUR_FINNHUB_API_KEY
stockify.finnhub.ws-url=wss://ws.finnhub.io
stockify.finnhub.watchlist=AAPL,MSFT,NVDA,TSLA,AMZN,GOOGL,META,JPM,BAC,SPY

# ── Kafka ─────────────────────────────────────────────────────────────
spring.kafka.bootstrap-servers=localhost:9092

# ── Spring Batch (Phase 1: H2 placeholder, replaced by TimescaleDB in Phase 2) ──
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always
spring.datasource.url=jdbc:h2:mem:stockify;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver

# ── Actuator ──────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.tracing.sampling.probability=1.0
